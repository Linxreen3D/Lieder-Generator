<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liedgen</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e3e1dc;--acc:#2f6f5e;--acc2:#e3f0eb;--bad:#b4442c;--warn:#b07a12}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e21;--ink:#ececee;--muted:#9a9aa1;--line:#323236;--acc:#6cc3a6;--acc2:#1f3530;--bad:#e2775f;--warn:#e0b04f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:2;flex-wrap:wrap}
header h1{font-size:18px;margin:0 12px 0 0}nav button{background:none;border:0;color:var(--muted);font:inherit;padding:6px 10px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--acc2);color:var(--acc);font-weight:600}
main{max-width:1150px;margin:0 auto;padding:20px 16px}section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi .v{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}.kpi .l{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:13px}td.n,th.n{text-align:right}
.tw{overflow-x:auto}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:260px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
button.p{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
@media (prefers-color-scheme:dark){button.p{color:#0d1f1a}}
button.s{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.score{font-size:30px;font-weight:700}.muted{color:var(--muted)}.small{font-size:13px}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--acc)}
.bar.mid i{background:var(--warn)}.bar.low i{background:var(--bad)}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:13px;margin:6px 0 10px;max-height:420px;overflow:auto}
.tl{display:flex;height:22px;border-radius:5px;overflow:hidden;margin:8px 0;border:1px solid var(--line)}
.tl span{font-size:10px;line-height:22px;padding:0 3px;white-space:nowrap;overflow:hidden;border-right:1px solid var(--card);color:var(--muted)}
.tl span.h{background:var(--acc2);color:var(--acc);font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--acc2);color:var(--acc);font-size:12px}
details summary{cursor:pointer;color:var(--acc);font-size:14px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<header><h1>🎵 Liedgen</h1>
<nav><button data-t="dash" class="on">Dashboard</button><button data-t="gen">Generator</button><button data-t="score">Analyse</button><button data-t="songs">Songs</button><button data-t="trends">Trends</button></nav>
<span id="ai" class="small muted"></span></header>
<main>

<section id="dash" class="on">
  <div class="grid" id="kpis"></div>
  <div class="card"><h3 style="margin-top:0">Artist-Profile</h3><div class="tw"><table id="atab"></table></div></div>
  <div class="card"><h3 style="margin-top:0">Neues Artist-Profil</h3>
    <div class="row">
      <div><label>Name</label><input id="a_name" placeholder="z.B. Nordvind"></div>
      <div><label>Genre</label><select id="a_genre" class="gsel"></select></div>
      <div><label>Spotify-URL</label><input id="a_url"></div>
      <div><label>Distributor</label><input id="a_dist" placeholder="z.B. DistroKid"></div>
      <div><button class="p" onclick="addArtist()">Anlegen</button></div>
    </div></div>
</section>

<section id="gen">
  <div class="card"><div class="row">
    <div><label>Genre</label><select id="g_genre" class="gsel"></select></div>
    <div><label>Thema (optional)</label><input id="g_theme" placeholder="leer = aus Themenpool"></div>
    <div><label>Kandidaten</label><input id="g_n" type="number" value="4" min="1" max="8"></div>
    <div><label>Backend</label><select id="g_be"><option value="auto">auto</option><option value="claude">Claude</option><option value="template">Offline</option></select></div>
    <div><button class="p" id="g_btn" onclick="gen()">Generieren</button></div>
  </div><p class="small muted" id="g_info"></p></div>
  <div id="g_out"></div>
</section>

<section id="score">
  <div class="card"><div class="row">
    <div><label>Titel</label><input id="s_title"></div>
    <div><label>Genre</label><select id="s_genre" class="gsel"></select></div>
    <div><label>BPM (optional)</label><input id="s_bpm" type="number"></div>
    <div><button class="p" onclick="scoreIt()">Bewerten</button></div>
  </div><br><label>Lyrics im Suno-Format ([Verse 1], [Chorus] …)</label><textarea id="s_lyrics"></textarea></div>
  <div id="s_out"></div>
</section>

<section id="songs"><div class="card"><div class="tw"><table id="stab"></table></div></div>
  <div class="card"><h3 style="margin-top:0">Streams erfassen</h3><div class="row">
    <div><label>Song-ID</label><input id="st_id" type="number"></div>
    <div><label>Tag</label><input id="st_day" type="date"></div>
    <div><label>Streams</label><input id="st_streams" type="number"></div>
    <div><label>Hörer</label><input id="st_l" type="number"></div>
    <div><label>Saves</label><input id="st_s" type="number"></div>
    <div><button class="p" onclick="addStats()">Speichern</button></div></div></div>
</section>

<section id="trends"><div id="tr_out" class="card"></div></section>
</main>
<script>
let G={}, S=[], ARTISTS=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('de-DE');
async function api(p,b){const r=await fetch(p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,section').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.t).classList.add('on');({dash:loadDash,songs:loadSongs,trends:loadTrends})[b.dataset.t]?.()});
function bar(v){const c=v>.75?'':v>.45?'mid':'low';return `<div class="bar ${c}"><i style="width:${Math.round(v*100)}%"></i></div>`}

async function init(){const j=await api('/api/genres');S=j.statuses;j.genres.forEach(g=>G[g.key]=g);
  document.querySelectorAll('.gsel').forEach(s=>s.innerHTML=j.genres.map(g=>`<option value="${g.key}">${esc(g.name)}</option>`).join(''));
  $('ai').textContent=j.claude?'Claude-Backend aktiv':'Offline-Modus (kein ANTHROPIC_API_KEY)';
  $('g_genre').onchange=()=>{const g=G[$('g_genre').value];$('g_info').textContent=`${g.description} · ${g.bpm_min}–${g.bpm_max} BPM · Hook ≤ ${g.hook_deadline_s}s · ${g.market_notes}`};$('g_genre').onchange();
  loadDash()}

async function loadDash(){const d=await api('/api/dashboard');const t=d.totals;ARTISTS=d.artists;
  $('kpis').innerHTML=[['Artists',t.artists],['Songs',t.songs],['Live',t.live],['Streams gesamt',fmt(t.streams)],['Streams 7 Tage',fmt(t.last7)],['Umsatz geschätzt',t.revenue_eur.toFixed(2)+' €']].map(([l,v])=>`<div class="card kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
  $('atab').innerHTML='<tr><th>Artist</th><th>Genre</th><th class="n">Songs</th><th>Pipeline</th><th class="n">Streams</th><th class="n">7 Tage</th><th class="n">Δ Woche</th><th class="n">≈ €</th><th>Top-Song</th></tr>'+
   (d.artists.map(a=>`<tr><td><b>${esc(a.name)}</b>${a.spotify_url?` <a href="${esc(a.spotify_url)}" target="_blank" rel="noopener">↗</a>`:''}<div class="small muted">${esc(a.distributor)}</div></td><td>${esc(G[a.genre]?.name||a.genre)}</td><td class="n">${a.songs}</td><td class="small">${Object.entries(a.pipeline).filter(([k,v])=>v).map(([k,v])=>`<span class="pill">${k} ${v}</span>`).join(' ')||'–'}</td><td class="n">${fmt(a.streams)}</td><td class="n">${fmt(a.last7)}</td><td class="n">${a.growth_7d==null?'–':(a.growth_7d>0?'+':'')+(a.growth_7d*100).toFixed(0)+' %'}</td><td class="n">${a.revenue_eur.toFixed(2)}</td><td class="small">${a.top_song?esc(a.top_song.title):'–'}</td></tr>`).join('')||'<tr><td colspan="9" class="muted">Noch keine Artists – unten anlegen. Tipp: ein Artist pro Nische.</td></tr>')}

async function addArtist(){try{await api('/api/artists',{name:$('a_name').value,genre:$('a_genre').value,spotify_url:$('a_url').value,distributor:$('a_dist').value});$('a_name').value='';loadDash()}catch(e){alert(e.message)}}

function reportHtml(r,tips){const tl=r.timeline.map(t=>`<span class="${t.hook?'h':''}" style="flex:${t.end-t.start}" title="${esc(t.tag)} ${t.start}–${t.end}s">${esc(t.tag)}</span>`).join('');
  return `<div class="flex"><span class="score">${r.total.toFixed(0)}</span><span class="muted">/100 · ${r.duration_s.toFixed(0)} s · ${r.bpm} BPM</span></div><div class="tl">${tl}</div>
  <table>${r.features.map(f=>`<tr><td class="small">${f.name}</td><td style="width:30%">${bar(f.score)}</td><td class="small muted">${esc(f.value)}</td></tr>`).join('')}</table>
  ${tips&&tips.length?'<ul class="small">'+tips.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>':''}`}

let LAST=[];
async function gen(){const b=$('g_btn');b.disabled=true;b.textContent='Generiere…';$('g_out').innerHTML='';
  try{LAST=await api('/api/generate',{genre:$('g_genre').value,theme:$('g_theme').value,n:+$('g_n').value,backend:$('g_be').value});
   $('g_out').innerHTML=LAST.map((c,i)=>`<div class="card"><div class="flex" style="justify-content:space-between"><h3 style="margin:0">#${i+1} ${esc(c.title)} <span class="pill">${c.backend}</span></h3>
   <div class="flex"><select id="as${i}"><option value="">– ohne Artist –</option>${ARTISTS.filter(a=>a.genre===c.genre).concat(ARTISTS.filter(a=>a.genre!==c.genre)).map(a=>`<option>${esc(a.name)}</option>`).join('')}</select><button class="s" onclick="saveCand(${i})">Ins Portfolio</button></div></div>
   <p class="small muted">${esc(c.concept)} · ${esc(c.key)}</p>${reportHtml(c.score,c.tips)}
   <details><summary>Suno-Prompt</summary>
   <div class="flex small"><b>Style of Music</b><button class="s" onclick="cp(${i},'style')">kopieren</button></div><pre>${esc(c.suno.style)}</pre>
   <div class="flex small"><b>Exclude Styles</b><button class="s" onclick="cp(${i},'exclude_styles')">kopieren</button></div><pre>${esc(c.suno.exclude_styles)}</pre>
   <div class="flex small"><b>Lyrics</b><button class="s" onclick="cp(${i},'lyrics')">kopieren</button></div><pre>${esc(c.suno.lyrics)}</pre></details></div>`).join('')}
  catch(e){$('g_out').innerHTML=`<div class="card" style="color:var(--bad)">${esc(e.message)}</div>`}
  b.disabled=false;b.textContent='Generieren'}
function cp(i,k){navigator.clipboard.writeText(LAST[i].suno[k])}
async function saveCand(i){const c=LAST[i];try{const r=await api('/api/songs',{title:c.title,genre:c.genre,artist:$('as'+i).value||null,viral_score:+c.score.total.toFixed(1),bpm:c.bpm,suno:c.suno,lyrics:c.lyrics,notes:c.concept});alert('Gespeichert als Song #'+r.id)}catch(e){alert(e.message)}}

async function scoreIt(){try{const r=await api('/api/score',{title:$('s_title').value,genre:$('s_genre').value,lyrics:$('s_lyrics').value,bpm:+$('s_bpm').value||null});$('s_out').innerHTML=`<div class="card">${reportHtml(r,r.tips)}</div>`}catch(e){alert(e.message)}}

async function loadSongs(){const rows=await api('/api/songs');if(!ARTISTS.length)await loadDash();
  $('stab').innerHTML='<tr><th>#</th><th>Titel</th><th>Artist</th><th>Genre</th><th class="n">Score</th><th>Status</th><th class="n">Streams</th></tr>'+(rows.map(s=>`<tr><td>${s.id}</td><td>${esc(s.title)}</td><td><select onchange="assign(${s.id},this.value)"><option value="">–</option>${ARTISTS.map(a=>`<option ${a.name===s.artist?'selected':''}>${esc(a.name)}</option>`).join('')}</select></td><td class="small">${esc(G[s.genre]?.name||s.genre)}</td><td class="n">${s.viral_score??'–'}</td>
  <td><select onchange="setStatus(${s.id},this.value)">${S.map(x=>`<option ${x===s.status?'selected':''}>${x}</option>`).join('')}</select></td><td class="n">${fmt(s.streams)}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">Noch keine Songs.</td></tr>');
  $('st_day').value=new Date().toISOString().slice(0,10)}
async function setStatus(id,st){await api(`/api/songs/${id}/status`,{status:st})}
async function assign(id,a){if(a)await api(`/api/songs/${id}/assign`,{artist:a})}
async function addStats(){try{await api('/api/stats',{song_id:+$('st_id').value,day:$('st_day').value,streams:+$('st_streams').value,listeners:+$('st_l').value||0,saves:+$('st_s').value||0});loadSongs()}catch(e){alert(e.message)}}

async function loadTrends(){const d=await api('/api/trends');if(!d.available){$('tr_out').innerHTML='<p class="muted">Keine Chart-Daten geladen. Starte mit <code>liedgen serve --trends charts.csv</code> (Format siehe README).</p>';return}
  $('tr_out').innerHTML='<h3 style="margin-top:0">Genre-Momentum</h3><div class="tw"><table><tr><th>Genre</th><th class="n">Tracks</th><th class="n">Momentum/Tag</th><th class="n">steigend</th><th class="n">BPM Median</th></tr>'+Object.entries(d.genres).map(([g,s])=>`<tr><td>${esc(G[g]?.name||g)}</td><td class="n">${s.tracks}</td><td class="n">${(s.momentum_per_day*100).toFixed(1)} %</td><td class="n">${s.rising_tracks}</td><td class="n">${s.bpm_median??'–'}</td></tr>`).join('')+'</table></div><h3>Steigende Tracks</h3><div class="tw"><table><tr><th>Track</th><th>Genre</th><th class="n">Wachstum/Tag</th><th class="n">R²</th></tr>'+d.rising.map(t=>`<tr><td>${esc(t.title)} – ${esc(t.artist)}</td><td>${esc(t.genre)}</td><td class="n">${(t.growth_per_day*100).toFixed(1)} %</td><td class="n">${t.r2.toFixed(2)}</td></tr>`).join('')+'</table></div>'}
init();
</script>
</body>
</html>
